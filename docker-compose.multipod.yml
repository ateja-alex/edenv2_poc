# Simulation locale de 2 pods EDEN pour un meme client (POC Kubernetes) :
# chaque "pod" = web (nginx) + app (php-fpm) ; volumes partages = RWX.
# Verifie : sessions Redis, parametrage visible sur les 2 pods, /storage servi,
# HTTPS derriere un proxy (Traefik, TLS termine en amont, HTTP redirige).
#   docker compose -f docker-compose.multipod.yml up --build
#   https://localhost:8443 (certificat auto-signe) ; http://localhost:8080 redirige
#   docker compose -f docker-compose.multipod.yml logs -f web1 web2
# Client reel (donnees locales, ignorees par git et Docker) :
#   ./bdd.sql                  dump charge a la creation du volume db
#   ./.local/<client>/Migrations, ./.local/<client>/storage_app (optionnel)
#   ./.local/<client>/.env      EDEN_MODEL_API_URL, EDEN_MODEL_API_KEY... (optionnel)
#   CLIENT=tsi docker compose -f docker-compose.multipod.yml up -d
#   repartir de zero : docker compose -f docker-compose.multipod.yml down -v
name: eden-poc-multipod

x-app: &app
  image: eden-app:dev
  build: { context: ., target: app }
  environment: &env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://localhost:8443
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    TRUSTED_PROXIES: "*"
    DB_HOST: db
    DB_DATABASE: eden
    DB_USERNAME: eden
    DB_PASSWORD: eden
    REDIS_HOST: redis
    REDIS_PREFIX: poc_client_
    CACHE_DRIVER: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: database
  # Variables propres au client, a remplir soi-meme (ignore par git) :
  # EDEN_MODEL_API_URL / EDEN_MODEL_API_KEY (traductions, licences, utilisateurs)
  env_file:
    - path: ./.local/${CLIENT:-aucun}/.env
      required: false
  networks: [interne]
  volumes: &shared
    - storage_app:/var/www/storage/app
    - migrations:/var/www/app/Migrations
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
    migrate: { condition: service_completed_successfully }

x-web: &web
  image: eden-web:dev
  build: { context: ., target: web }
  networks: [interne]
  volumes:
    # nginx sert /storage (lien public/storage -> storage/app/public)
    - storage_app:/var/www/storage/app:ro

services:
  app1: *app
  app2: *app
  web1:
    <<: *web
    environment: { PHP_FPM_HOST: app1 }
    depends_on: [app1]
  web2:
    <<: *web
    environment: { PHP_FPM_HOST: app2 }
    depends_on: [app2]

  # Migrations EDEN : une seule fois, avant les pods (= Job Kubernetes)
  migrate:
    <<: *app
    user: www-data
    command: ["php", "artisan", "eden:migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      fichiers: { condition: service_completed_successfully }

  # Copie les fichiers du client dans les volumes partages (= restauration RWX),
  # seulement si le volume est vide : les modifications faites ensuite sont conservees
  fichiers:
    image: busybox:1.37
    restart: "no"
    volumes:
      - ./.local/${CLIENT:-aucun}:/src:ro
      - storage_app:/dst/storage_app
      - migrations:/dst/migrations
    command:
      - sh
      - -c
      - |
        for d in migrations:Migrations storage_app:storage_app; do
          dst=/dst/$${d%%:*}; src=/src/$${d##*:}
          if [ -d "$$src" ] && [ -z "$$(ls -A "$$dst" | grep -v '^public$$')" ]; then
            cp -a "$$src/." "$$dst/" && echo "copie $$src -> $$dst"
          fi
        done
        chown -R 33:33 /dst
        # dossiers lisibles par nginx (crees en 0700 par les anciennes versions)
        find /dst/storage_app -type d -exec chmod 755 {} +

  worker:
    <<: *app
    user: www-data
    restart: unless-stopped   # redemarre tant que MariaDB n'est pas prete
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  traefik:
    image: traefik:v3.5
    command:
      - --entrypoints.websecure.address=:443
      # HTTP -> HTTPS, comme sur l'ingress cible (port local de l'HTTPS)
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:${WEB_PORT:-8443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=INFO
      - --accesslog=true
    ports: ["${WEB_PORT:-8443}:443", "${HTTP_PORT:-8080}:80"]
    networks: [default, interne]   # seul service avec un pied hors du reseau interne
    volumes:
      - ./docker/compose/traefik.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [web1, web2]

  db:
    image: mariadb:10.11   # version de la prod
    networks: [interne]
    environment:
      MARIADB_DATABASE: eden
      MARIADB_USER: eden
      MARIADB_PASSWORD: eden
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
      # charge une seule fois, a la creation du volume (absent : base vide)
      - ./bdd.sql:/docker-entrypoint-initdb.d/bdd.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 30
      start_period: 30m   # import d'un gros dump
  redis:
    image: redis:7-alpine
    networks: [interne]

# Reseau sans acces a Internet : avec des donnees de prod, EDEN ne doit envoyer
# aucun mail (le SMTP vient de la base) ni appeler d'API externe (Google, Microsoft...)
networks:
  interne:
    internal: true

volumes:
  storage_app:
  migrations:
  db:
