; Xdebug 3 configuration (defaults suitable for dev, disabled by default)
; Enable modes via environment variable XDEBUG_MODE (e.g., debug,develop)
; See: https://xdebug.org/docs/all_settings

; Do NOT enable by default; controlled by env XDEBUG_MODE
xdebug.mode=debug

; Start only when explicitly requested (Cookie/GET/POST/ENV trigger)
xdebug.start_with_request=trigger

; Default client settings (overridable via XDEBUG_CONFIG env)
xdebug.client_host=10.255.20.2
xdebug.client_port=9003
xdebug.discover_client_host=0

; IDE integration
xdebug.idekey=PHPSTORM

; Noise control / diagnostics
; log_level 7 = full communication trace (connexions + breakpoints + chemins)
xdebug.log=/tmp/xdebug.log
xdebug.log_level=7
