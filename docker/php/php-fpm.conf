[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 3600s

; ondemand : aucun worker au repos, cree a la demande et arrete apres inactivite
; (moins de memoire a vide ; la capacite se gere par le nombre de pods, pas de workers)
pm = ondemand
pm.max_children = ${FPM_MAX_CHILDREN}
pm.process_idle_timeout = ${FPM_IDLE_TIMEOUT}
pm.max_requests = 500
