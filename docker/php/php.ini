; Runtime PHP - image de production
max_execution_time = 3600
default_socket_timeout = 3600
memory_limit = 2048M

post_max_size = 256M
upload_max_filesize = 256M
max_input_vars = 5000

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.save_comments = 1
opcache.validate_timestamps = 0
; Le parametrage no-code ecrit du PHP a l'execution (storage/app/eden_*.php,
; app/Migrations) sur le volume partage : ces fichiers ne doivent pas etre
; mis en cache, sinon aucun pod ne voit la modification avant un redemarrage.
; Le code de l'image reste fige (validate_timestamps = 0).
opcache.blacklist_filename = /usr/local/etc/php/opcache-blacklist.txt
realpath_cache_size = 4096K
realpath_cache_ttl = 600
