# Build + smoke test local des images (pas le compose de dev : voir docker-compose/)
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml up
name: eden-poc
services:
  app:
    image: eden-app:dev
    build: { context: ., target: app }
    environment: &env
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HOST: db
      DB_DATABASE: eden
      DB_USERNAME: eden
      DB_PASSWORD: eden
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
    depends_on: [db, redis]
  web:
    image: eden-web:dev
    build: { context: ., target: web }
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [app]
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: eden
      MARIADB_USER: eden
      MARIADB_PASSWORD: eden
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
  redis:
    image: redis:7-alpine
