# Fichiers du client, partages par tous les pods (RWX = OVH File Storage, NFS) :
#   storage_app/  -> /var/www/storage/app   (parametrage eden_*.php, PJ, exports, composants)
#   migrations/   -> /var/www/app/Migrations (migrations generees par le parametrage)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eden-fichiers
spec:
  accessModes: [ReadWriteMany]
  # Partage OVH File Storage commun, sous-dossier du client (plateforme/stockage)
  storageClassName: eden-nfs
  resources:
    requests:
      storage: 50Gi   # indicatif : pas de quota par sous-dossier sur NFS
