# Redis propre au client : sessions (base 0) et cache (base 1).
# Pas partage entre clients : EDEN vide le cache avec Cache::flush() (FLUSHDB),
# ce qui viderait le cache de tous les clients d'un Redis commun.
# Sans persistance : un redemarrage deconnecte les utilisateurs (acceptable pour le POC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # volatile-lru : n'evince que les cles avec expiration (sessions, cache),
          # jamais eden.version (Cache::forever)
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "400mb", "--maxmemory-policy", "volatile-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
