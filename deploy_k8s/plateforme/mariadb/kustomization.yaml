# kubectl apply -k deploy_k8s/plateforme/mariadb
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eden-plateforme

resources:
  - namespace.yaml
  - mariadb.yaml

# secret.env (ignore par git) : MARIADB_ROOT_PASSWORD=...   (modele : secret.env.example)
secretGenerator:
  - name: mariadb-root
    envs: [secret.env]

labels:
  - pairs:
      app.kubernetes.io/part-of: eden
