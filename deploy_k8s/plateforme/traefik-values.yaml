# Traefik, ingress du cluster (chart Helm officiel, valeurs pour la version 41.6.1 / Traefik 3.7) :
#   helm upgrade --install traefik traefik --repo https://traefik.github.io/charts \
#     -n traefik --create-namespace --version 41.6.1 -f deploy_k8s/plateforme/traefik-values.yaml
# Le Service LoadBalancer cree un LB Octavia OVH (1 IP publique pour tous les clients).
deployment:
  replicas: 2

# Pool fixe : le LB (externalTrafficPolicy: Local) n'envoie le trafic qu'aux noeuds du socle
nodeSelector:
  nodepool: poc-k8s-v2-socle

ports:
  web:
    http:
      # Toute requete HTTP est redirigee en HTTPS : l'application ne verifie plus le HTTPS
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    # IP reelle du client : le LB Octavia l'envoie en proxy protocol v2 (voir service)
    proxyProtocol:
      trustedIPs: ["10.10.0.0/16", "10.2.0.0/16"]   # reseau prive (LB) et pods
  websecure:
    # TLS active par defaut ; sans certificat, certificat auto-signe de Traefik (POC)
    proxyProtocol:
      trustedIPs: ["10.10.0.0/16", "10.2.0.0/16"]

# Sans proxy protocol, Traefik voit une IP interne (10.2.x.0) : pas de filtrage par IP
# possible. Guide OVH "Getting the source IP behind the LoadBalancer".
service:
  annotations:
    loadbalancer.openstack.org/proxy-protocol: "v2"
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Local

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }
